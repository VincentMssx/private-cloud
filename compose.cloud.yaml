services:
  app:
    environment:
      APACHE_DISABLE_REWRITE_IP: "1"
    networks: [default, front]
    restart: unless-stopped
  db:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  analysis:
    restart: unless-stopped
  cron:
    restart: unless-stopped
  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      MAISON_DOMAIN: ${MAISON_DOMAIN:?Configurer le domaine DNS}
      NO_PROXY: app,localhost,127.0.0.1
      no_proxy: app,localhost,127.0.0.1
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports: ["80:80", "443:443"]
    networks:
      front:
        ipv4_address: 172.30.50.2
networks:
  front:
    ipam:
      config:
        - subnet: 172.30.50.0/28
volumes:
  caddy_data:
  caddy_config:
