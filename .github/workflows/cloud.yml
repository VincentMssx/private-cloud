name: Déployer Maison
on:
  push:
    tags: ['maison-prod-v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maison-production
  cancel-in-progress: false
jobs:
  validation:
    if: startsWith(github.ref, 'refs/tags/maison-')
    uses: ./.github/workflows/local.yml
  deploiement:
    needs: validation
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Envoyer la version vérifiée et contrôler HTTPS
        env:
          DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$DEPLOY_TARGET" =~ ^[a-z_][a-z0-9_-]*@[a-zA-Z0-9.-]+$ ]]
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/maison
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # HEAD est le commit effectivement extrait, y compris pour un tag annoté.
          rev=$(git rev-parse HEAD)
          ssh_args=(-i ~/.ssh/maison -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp "${ssh_args[@]}" ops/deploy.sh "$DEPLOY_TARGET:/opt/maison/deploy.sh"
          git archive --format=tar.gz HEAD | ssh "${ssh_args[@]}" "$DEPLOY_TARGET" "bash /opt/maison/deploy.sh $rev"
